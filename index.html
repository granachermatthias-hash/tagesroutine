<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --font-head: 'Oswald', 'Arial Narrow', sans-serif;
    --font-work: 'Special Elite', 'Courier New', monospace;
    --font-free: 'Share Tech Mono', 'Courier New', monospace;
  }

  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body { min-height: 100%; overflow-x: hidden; }
  body {
    background: #06080c;
    font-family: var(--font-body, var(--font-work));
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    min-height: 100dvh;
    padding: calc(16px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right))
             calc(32px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  /* Touch: kein 300ms-Delay, kein grauer Blitz beim Antippen */
  .switch, .kbtn, .sound, .phase-label, .block { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

  /* ---------- THEME TOKENS ---------- */
  .machine.theme-work {
    --bg1:#241a12; --bg2:#120c07;
    --panel:#2b1f14; --panel-edge:#4a3620;
    --metal:#b98a2e; --metal-hi:#ecd28a; --metal-lo:#6e4f16;
    --accent:#ff9e3d; --accent2:#c8772a; --glow: rgba(255,158,61,.45);
    --text:#efe2c4; --text-dim:#b39b6d; --stamp:#7a5a1e;
    --pipe:#8a5a2b; --pipe-glow: rgba(0,0,0,0);
    --font-body: var(--font-work);
  }
  .machine.theme-free {
    --bg1:#0b1220; --bg2:#04060c;
    --panel:#0e1622; --panel-edge:#1c3446;
    --metal:#2a3648; --metal-hi:#5c86a0; --metal-lo:#121b28;
    --accent:#22e0ff; --accent2:#ff2d95; --glow: rgba(34,224,255,.5);
    --text:#dbeeff; --text-dim:#7089a5; --stamp:#22e0ff;
    --pipe:#12e6ff; --pipe-glow: rgba(34,224,255,.55);
    --font-body: var(--font-free);
    /* neon deko palette */
    --neon-cyan:#22e0ff; --neon-mag:#ff2ea6; --neon-yellow:#ffe600;
    --neon-blue:#3d6bff; --neon-green:#2bff88;
    --light-warm:#ffdca8; --light-cold:#eaf6ff;
  }

  /* ---------- FRAME ---------- */
  .machine {
    position: relative;
    width: 100%;
    max-width: 620px;
    padding: 20px 18px 26px;
    border-radius: 16px;
    background:
      radial-gradient(120% 90% at 50% 0%, var(--bg1), var(--bg2));
    border: 2px solid var(--panel-edge);
    box-shadow: inset 0 0 60px rgba(0,0,0,.6), 0 20px 50px rgba(0,0,0,.6);
    transition: background .7s ease, border-color .7s ease;
    overflow: hidden;
    font-family: var(--font-body);
    color: var(--text);
  }
  /* side rails / pipes */
  .machine::before, .machine::after {
    content:""; position:absolute; top:14px; bottom:14px; width:6px; border-radius:3px;
    background: linear-gradient(var(--metal-hi), var(--pipe), var(--metal-lo));
    box-shadow: 0 0 0 1px rgba(0,0,0,.4), 0 0 12px var(--pipe-glow);
    transition: background .7s ease, box-shadow .7s ease;
  }
  .machine::before { left: 6px; }
  .machine::after { right: 6px; }

  /* ---------- HEADER ---------- */
  .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .head { flex: 1 1 auto; min-width: 0; text-align: center; padding: 4px 4px 10px; }
  .weekday {
    font-family: var(--font-head);
    font-weight: 600;
    letter-spacing: .28em;
    text-transform: uppercase;
    font-size: clamp(26px, 7vw, 40px);
    color: var(--accent);
    text-shadow: 0 0 18px var(--glow);
    transition: color .7s ease, text-shadow .7s ease;
  }
  .datum {
    font-family: var(--font-body);
    letter-spacing: .12em;
    font-size: 14px;
    color: var(--text-dim);
    margin-top: 2px;
    transition: color .7s ease;
  }

  /* ---------- TOP ROW: rest info centered ---------- */
  .toprow {
    display: flex; justify-content: center; align-items: center;
    gap: 12px; margin: 6px 4px 14px; flex-wrap: wrap;
  }
  .rest { display: flex; flex-direction: row; flex-wrap: wrap; gap: 18px; justify-content: center; }
  .plate {
    background: linear-gradient(160deg, var(--panel), var(--bg2));
    border: 1px solid var(--metal-lo);
    border-left: 3px solid var(--metal);
    border-radius: 6px;
    padding: 8px 14px;
    min-width: 124px; text-align: center;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
    transition: background .7s ease, border-color .7s ease;
  }
  .plate .lbl {
    font-family: var(--font-head); font-weight: 500;
    font-size: 10px; letter-spacing: .22em; text-transform: uppercase;
    color: var(--text-dim); transition: color .7s ease;
  }
  .plate .val {
    font-family: var(--font-body);
    font-size: 21px; color: var(--text); margin-top: 1px;
    transition: color .7s ease;
    font-variant-numeric: tabular-nums;
  }

  /* cockpit: small toggle in top-right corner */
  .cockpit {
    position: relative; z-index: 3;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .plaque {
    font-family: var(--font-head); font-weight: 600;
    font-size: 9px; letter-spacing: .1em; text-transform: uppercase;
    padding: 3px 7px; border-radius: 4px;
    background: var(--panel); border: 1px solid var(--metal-lo);
    color: var(--accent); text-shadow: 0 0 10px var(--glow);
    transition: color .7s ease, background .7s ease, border-color .7s ease;
    text-align: center; white-space: nowrap;
  }
  .plaque.flip { animation: plaqueFlip .5s ease; }
  @keyframes plaqueFlip {
    0%{ transform: rotateX(0); }
    50%{ transform: rotateX(90deg); }
    100%{ transform: rotateX(0); }
  }

  .switch {
    position: relative; cursor: pointer;
    width: 50px; height: 26px; border-radius: 14px;
    background: linear-gradient(180deg, var(--bg2), var(--panel));
    border: 2px solid var(--metal-lo);
    box-shadow: inset 0 2px 5px rgba(0,0,0,.55);
    transition: border-color .5s ease, background .5s ease;
    user-select: none;
  }
  .switch:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .switch .knob {
    position: absolute; top: 50%; left: 3px; transform: translateY(-50%);
    width: 18px; height: 18px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--metal-hi), var(--metal) 55%, var(--metal-lo));
    border: 1px solid rgba(0,0,0,.5);
    box-shadow: 0 2px 4px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.4);
    transition: left .28s cubic-bezier(.5,1.4,.5,1), background .5s ease, box-shadow .5s ease;
  }
  .switch.on .knob {
    left: calc(100% - 21px);
    background: radial-gradient(circle at 35% 30%, var(--accent), var(--metal-lo));
    box-shadow: 0 0 10px var(--glow), 0 2px 4px rgba(0,0,0,.5);
  }

  /* ---------- GAUGE ---------- */
  .gauge-wrap { display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 8px; margin: 2px auto 8px; max-width: 400px; }
  .gauge-col { display: flex; flex-direction: column; align-items: center; flex: 1 1 auto; min-width: 0; }
  svg.gauge { width: min(100%, 380px); height: auto; display: block; overflow: visible; }

  .gauge-ring { fill: none; stroke: var(--metal-lo); stroke-width: 16; transition: stroke .7s ease; }
  .gauge-ring2 { fill: none; stroke: var(--metal); stroke-width: 4; opacity:.9; transition: stroke .7s ease; }
  .gauge-face { fill: url(#faceGrad); }
  .gtick { stroke: var(--metal); stroke-width: 2; opacity:.55; transition: stroke .7s ease; }

  .phase-label { cursor: pointer; }
  .phase-label text {
    font-family: var(--font-head); font-weight: 600; font-size: 15px;
    letter-spacing: .08em; fill: var(--text-dim);
    transition: fill .35s ease; text-transform: uppercase;
  }
  .phase-label.active text { fill: var(--accent); }
  .phase-hit { fill: transparent; }

  #needle { transition: transform .6s cubic-bezier(.34,1.4,.4,1); transform-box: view-box; transform-origin: 200px 200px; }
  .needle-body { fill: var(--accent); filter: drop-shadow(0 0 6px var(--glow)); transition: fill .7s ease; }

  .knobs { display: flex; gap: 40px; margin-top: -6px; }
  .kbtn {
    width: 40px; height: 40px; border-radius: 50%; cursor: pointer;

  /* ---------- BLOCKS ---------- */
  .blocks {

  .card {
    position: relative; width: 100%; height: 100%; min-height: 128px;

  .block.done .card { transform: rotateY(180deg); }
  .block.done { opacity: .5; filter: saturate(.55); }
  .face {

  .face .ort {

  }
  .face .tat {

  }
  .face .rivet {
    position: absolute; bottom: 8px; right: 9px; width: 6px; height: 6px;
    border-radius: 50%; background: var(--metal);
    box-shadow: inset 0 0 2px rgba(0,0,0,.7);

  /* Kachel ohne Beschreibung: Titel füllt den ganzen Kasten */
  .face.front.solo { align-items: center; justify-content: center; text-align: center; }
  .face.front.solo .ort {
    font-size: clamp(16px, 4.4vw, 19px); letter-spacing: .06em; line-height: 1.25;
  }
  .face.back {
    transform: rotateY(180deg);
    align-items: center; justify-content: center; text-align: center;

  .face.back .stamp {
    font-family: var(--font-head); font-weight: 700; letter-spacing: .16em;

  /* ---------- FOOTER ---------- */
  .foot { display: flex; justify-content: center; margin-top: 12px; }

  .progress { margin: 14px 4px 4px; display: flex; flex-direction: column; align-items: center; gap: 6px; }

  .progress .plabel span { color: var(--accent); text-shadow: 0 0 8px var(--glow); }
  /* Wochenübersicht rechts neben der Uhr */
  .week { flex: 0 0 60px; align-self: center; display: flex; flex-direction: column; gap: 5px; }
  .wk-title {
    font-family: var(--font-head); font-size: 9px; letter-spacing: .14em;

  .wk-row {
    position: relative;
    display: flex; align-items: center; justify-content: space-between;

    background: linear-gradient(165deg, var(--panel), var(--bg2));

  .wk-row .wk-day { font-family: var(--font-head); font-size: 11px; letter-spacing: .04em; color: var(--text-dim); }

  .wk-row.today { box-shadow: 0 0 8px var(--glow); }

  /* Medaillen: dicker, verzierter Metallrahmen wie ein historischer Bilderrahmen */
  .wk-row.bronze {
    border-image: linear-gradient(135deg,#e6a75c 0%,#a9611f 28%,#6f3f12 50%,#c47e3a 72%,#5e3410 100%) 1;

  .wk-row.silber {

  .wk-row.gold {

  /* Tagesregeln (Checkboxen über der Ton-Zeile) */
  .rules { display: flex; flex-direction: row; gap: 12px; margin: 12px 4px 2px; }

    display: flex; align-items: center; justify-content: center; gap: 7px; cursor: pointer;

  .rule .rbox {
    flex: 0 0 auto; width: 18px; height: 18px; border-radius: 4px;

  }
  .rule .rtxt { font-family: var(--font-body); font-size: 12px; white-space: nowrap; color: var(--text-dim); transition: color .35s ease; }
  .rule.on { border-color: var(--accent); box-shadow: 0 0 8px var(--glow); }
  .rule.on .rbox { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 8px var(--glow); }
  .rule.on .rbox::after {
    content: ""; position: absolute; left: 4px; top: 0; width: 5px; height: 10px;

  .sound:hover { color: var(--text); }
  .sound .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); transition: background .3s ease, box-shadow .3s ease; }
  .sound.on .dot { background: var(--accent); box-shadow: 0 0 8px var(--glow); }

  /* ---------- DECORATION LAYERS ---------- */
  .deco { position: absolute; inset: 0; pointer-events: none; z-index: 1; opacity: 0; transition: opacity .7s ease; }
  .machine.theme-work .deco-steam { opacity: 1; }

  /* keep interactive content above decoration */
  .topbar, .toprow, .gauge-wrap, .progress, .blocks, .rules { position: relative; z-index: 2; }

  /* -- steampunk: gears + bolts + valve wheel -- */
  .gear { position: absolute; color: var(--metal); opacity: .5; }
  .gear svg { display: block; width: 100%; height: 100%; }
  .gear .rim { fill: none; stroke: currentColor; }
  .gear .hub { fill: var(--bg2); stroke: currentColor; stroke-width: 4; }
  .gear .spoke { stroke: currentColor; stroke-width: 5; }
  .gear.g1 { width: 120px; height: 120px; top: -34px; left: -30px; opacity: .38; animation: spin 34s linear infinite; }
  .gear.g2 { width: 84px; height: 84px; top: -18px; left: 46px; opacity: .3; color: var(--accent2); animation: spinR 26s linear infinite; }
  .gear.g3 { width: 150px; height: 150px; bottom: -56px; right: -40px; opacity: .34; animation: spinR 40s linear infinite; }
  .gear.g4 { width: 70px; height: 70px; bottom: 40px; left: -22px; opacity: .3; animation: spin 22s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes spinR { to { transform: rotate(-360deg); } }

  .bolts { position: absolute; top: 8px; left: 26px; right: 26px; display: flex; justify-content: space-between; }
  .bolt { width: 9px; height: 9px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--metal-hi), var(--metal) 60%, var(--metal-lo));
    box-shadow: inset 0 -1px 2px rgba(0,0,0,.6); opacity: .7; }

  /* -- cyberpunk: neon tubes, signs, city lights -- */
  .tube { position: absolute; border-radius: 4px; opacity: .8; }
  .tube.v { width: 3px; }
  .tube.h { height: 3px; }
  .tube.t1 { top: 30px; bottom: 120px; left: 16px; background: var(--neon-cyan);
    box-shadow: 0 0 8px var(--neon-cyan), 0 0 18px var(--neon-cyan); animation: flick 5s infinite; }
  .tube.t2 { top: 90px; bottom: 40px; right: 16px; background: var(--neon-yellow);
    box-shadow: 0 0 8px var(--neon-yellow), 0 0 18px var(--neon-yellow); animation: flick 7s infinite .5s; }
  .tube.t3 { left: 30px; right: 120px; bottom: 74px; background: var(--neon-blue);
    box-shadow: 0 0 8px var(--neon-blue), 0 0 16px var(--neon-blue); animation: flick 6s infinite 1s; }

  .sign { position: absolute; font-family: var(--font-head); font-weight: 700;
    letter-spacing: .1em; padding: 3px 8px; border-radius: 4px; }
  .sign.s1 { top: 16px; left: 20px; font-size: 13px; color: var(--neon-mag);
    border: 2px solid var(--neon-mag); box-shadow: 0 0 10px var(--neon-mag), inset 0 0 8px rgba(255,46,166,.5);
    text-shadow: 0 0 8px var(--neon-mag); animation: flick 4s infinite .2s; }
  .sign.s2 { top: 60px; right: 22px; font-size: 12px; color: var(--neon-green);
    border: 1px solid var(--neon-green); box-shadow: 0 0 9px var(--neon-green);
    text-shadow: 0 0 7px var(--neon-green); animation: buzz 3.2s infinite; }
  .sign.s3 { bottom: 44px; left: 22px; writing-mode: vertical-rl; font-size: 15px;
    letter-spacing: .28em; color: var(--neon-cyan); text-shadow: 0 0 8px var(--neon-cyan);
    animation: flick 8s infinite .8s; }
  .sign.arrow { bottom: 96px; right: 26px; font-size: 20px; color: var(--neon-yellow);
    text-shadow: 0 0 10px var(--neon-yellow); animation: buzz 2.6s infinite .4s; }

  .lights { position: absolute; inset: 0; }
  .lights i { position: absolute; width: 4px; height: 4px; border-radius: 50%; opacity: .85; }
  @keyframes flick { 0%,100%{opacity:.85;} 92%{opacity:.85;} 93%{opacity:.35;} 94%{opacity:.85;} 96%{opacity:.4;} 97%{opacity:.85;} }
  @keyframes buzz { 0%,100%{opacity:.9;} 48%{opacity:.55;} 50%{opacity:.9;} }

  /* surge overlay on world change */
  .surge {
    position: absolute; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(circle at 50% 30%, var(--glow), transparent 60%);
    z-index: 20;
  }
  .surge.fire { animation: surge .6s ease; }
  @keyframes surge { 0%{opacity:0;} 25%{opacity:.9;} 100%{opacity:0;} }

  /* ---------- SMARTPHONE ---------- */
  @media (max-width: 480px) {

  @media (max-width: 360px) {

  @media (prefers-reduced-motion: reduce) {
    *, .card, #needle { transition: none !important; animation: none !important; }
  }
</style>

<body>

<div class="machine theme-work" id="machine">

<script>
(function(){
  "use strict";

  const ROUTINE = {
    morgen: [
      ["Bad & Krafttraining", ""],

    ],
    mittag: [

  };

  const PHASES = ["morgen", "mittag", "nachmittag", "abend"];
  const PHASE_NAMES = { morgen:"Morgen", mittag:"Mittag", nachmittag:"Nachmittag", abend:"Abend" };
  const ANGLES = { morgen:-67.5, mittag:-22.5, nachmittag:22.5, abend:67.5 };

  // ---------- state ----------
  const today = new Date();
  const dayKey = today.getFullYear() + "-" + pad(today.getMonth()+1) + "-" + pad(today.getDate());
  const WD = ["Mo","Di","Mi","Do","Fr","Sa","So"];
  function mondayKey(d){
    const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const off = (x.getDay()+6)%7;
    x.setDate(x.getDate()-off);
    return x.getFullYear()+"-"+pad(x.getMonth()+1)+"-"+pad(x.getDate());
  }
  const weekKey  = mondayKey(today);
  const todayIdx = (today.getDay()+6)%7;
  let   weekArr  = [0,0,0,0,0,0,0];
  let isFree = autoFree(today);
  let phase = autoPhase(today);
  let soundOn = true;
  const done = new Set();

  // ---------- helpers ----------
  function pad(n){ return String(n).padStart(2,"0"); }

  function easter(y){
    const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,
      f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,
      i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
      mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;
    return new Date(y, mo-1, da);
  }
  function addDays(dt,n){ const x=new Date(dt); x.setDate(x.getDate()+n); return x; }
  function sameDay(a,b){ return a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }

  function isHolidayRLP(dt){
    const y = dt.getFullYear();
    const fixed = [[0,1],[4,1],[9,3],[10,1],[11,25],[11,26]]; // Neujahr, 1.Mai, Einheit, Allerheiligen, Weihnachten
    for (const [mo,da] of fixed) if (dt.getMonth()===mo && dt.getDate()===da) return true;
    const e = easter(y);
    const movable = [ addDays(e,-2), addDays(e,1), addDays(e,39), addDays(e,50), addDays(e,60) ];
    for (const h of movable) if (sameDay(dt,h)) return true;
    return false;
  }

  function autoFree(dt){
    const wd = dt.getDay(); // 0 So, 6 Sa
    if (wd===0 || wd===6) return true;
    return isHolidayRLP(dt);
  }
  function autoPhase(dt){
    const h = dt.getHours();
    if (h < 11) return "morgen";
    if (h < 14) return "mittag";
    if (h < 18) return "nachmittag";
    return "abend";
  }

  // ---------- storage (graceful) ----------
  // Reihenfolge: Claude-Speicher zuerst (falls veroeffentlicht), sonst
  // lokaler Browser-Speicher. So merkt sich auch die heruntergeladene,
  // lokal geoeffnete Kopie die Haken pro Tag.
  async function sget(key){
    try {
      if(window.storage){ const r = await window.storage.get(key); if(r && r.value != null) return r.value; }
    } catch(e){}
    try { return localStorage.getItem(key); } catch(e){ return null; }
  }
  async function sset(key,val){
    try { if(window.storage){ await window.storage.set(key,val); } } catch(e){}
    try { localStorage.setItem(key,val); } catch(e){}
  }

  // ---------- audio ----------
  let ac = null;
  function audio(){
    if (!ac) { try { ac = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){ return null; } }
    if (ac.state === "suspended") ac.resume();
    return ac;
  }
  function tone(freq, dur, type, gain, glideTo){
    if (!soundOn) return; const c = audio(); if(!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || "sine"; o.frequency.setValueAtTime(freq, c.currentTime);
    if (glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, c.currentTime + dur);
    g.gain.setValueAtTime(0.0001, c.currentTime);
    g.gain.exponentialRampToValueAtTime(gain||0.15, c.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
    o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + dur + 0.02);
  }
  function noise(dur, cutoff, gain){
    if (!soundOn) return; const c = audio(); if(!c) return;
    const n = Math.floor(c.sampleRate*dur), buf = c.createBuffer(1,n,c.sampleRate), d = buf.getChannelData(0);
    for (let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
    const s = c.createBufferSource(); s.buffer = buf;
    const f = c.createBiquadFilter(); f.type="lowpass"; f.frequency.value = cutoff||1200;
    const g = c.createGain(); g.gain.value = gain||0.12;
    s.connect(f); f.connect(g); g.connect(c.destination); s.start();
  }

  function sndTick(){ isFree ? tone(1400,0.05,"square",0.06) : tone(900,0.04,"triangle",0.07); }
  function sndBlock(){ if(isFree){ tone(660,0.09,"square",0.08); tone(990,0.07,"sawtooth",0.05);} else { tone(180,0.09,"triangle",0.14); noise(0.05,600,0.08);} }
  function sndSwitch(){ tone(120,0.06,"square",0.16); setTimeout(()=>tone(90,0.05,"square",0.12),40); }
  function sndToFree(){ tone(220,0.5,"sawtooth",0.12,880); setTimeout(()=>tone(1320,0.25,"square",0.06),120); }
  function sndToWork(){ noise(0.45,900,0.16); setTimeout(()=>tone(150,0.12,"triangle",0.14),90); }

  // ---------- DOM ----------
  const machine   = document.getElementById("machine");
  const weekdayEl = document.getElementById("weekday");
  const datumEl   = document.getElementById("datum");
  const wakeEl    = document.getElementById("wake");
  const bedEl     = document.getElementById("bed");
  const plaqueEl  = document.getElementById("plaque");
  const switchEl  = document.getElementById("switch");
  const needleEl  = document.getElementById("needle");
  const phaseNm   = document.getElementById("phaseName");
  const blocksEl  = document.getElementById("blocks");
  const surgeEl   = document.getElementById("surge");
  const soundEl   = document.getElementById("sound");
  const soundTxt  = document.getElementById("soundTxt");
  const pfillEl   = document.getElementById("pfill");
  const pcountEl  = document.getElementById("pcount");
  const ptotalEl  = document.getElementById("ptotal");
  const RULES     = ["Wasser", "Freizeit 21", "2 Mahlzeiten"];
  const TOTAL     = PHASES.reduce((n,ph)=>n+ROUTINE[ph].length,0) + RULES.length;
  const weekEl    = document.getElementById("week");
  const rulesEl   = document.getElementById("rules");
  const BRONZE    = Math.max(1, Math.ceil(TOTAL * 0.30));   // 5 bei 16
  const SILVER    = Math.max(1, Math.ceil(TOTAL * 2 / 3));  // 11 bei 16

  // build ticks + labels
  (function buildGauge(){
    const ticksG = document.getElementById("ticks");
    const labelsG = document.getElementById("labels");
    const cx=200, cy=200;
    // minor ticks across the arc
    for (let a=-80; a<=80; a+=10){
      const rad = a*Math.PI/180;
      const x1 = cx + Math.sin(rad)*128, y1 = cy - Math.cos(rad)*128;
      const x2 = cx + Math.sin(rad)*138, y2 = cy - Math.cos(rad)*138;
      const ln = document.createElementNS("http://www.w3.org/2000/svg","line");
      ln.setAttribute("x1",x1); ln.setAttribute("y1",y1);
      ln.setAttribute("x2",x2); ln.setAttribute("y2",y2);
      ln.setAttribute("class","gtick");
      ticksG.appendChild(ln);
    }
    PHASES.forEach(p=>{
      const a = ANGLES[p]*Math.PI/180;
      const x = cx + Math.sin(a)*102, y = cy - Math.cos(a)*102 + 5;
      const g = document.createElementNS("http://www.w3.org/2000/svg","g");
      g.setAttribute("class","phase-label"); g.setAttribute("data-phase",p);
      const hit = document.createElementNS("http://www.w3.org/2000/svg","circle");
      hit.setAttribute("cx",x); hit.setAttribute("cy",y-5); hit.setAttribute("r",26);
      hit.setAttribute("class","phase-hit");
      const t = document.createElementNS("http://www.w3.org/2000/svg","text");
      t.setAttribute("x",x); t.setAttribute("y",y);
      t.setAttribute("text-anchor","middle");
      t.textContent = PHASE_NAMES[p];
      g.appendChild(hit); g.appendChild(t);
      g.addEventListener("click",()=>setPhase(p,true));
      labelsG.appendChild(g);
    });
  })();

  function renderBlocks(){
    blocksEl.innerHTML = "";
    ROUTINE[phase].forEach((item,i)=>{
      const id = phase + "-" + i;
      const block = document.createElement("div");
      block.className = "block" + (done.has(id) ? " done" : "");
      block.dataset.id = id;

      const card = document.createElement("div"); card.className = "card";
      const front = document.createElement("div"); front.className = "face front" + (item[1] ? "" : " solo");
      const ort = document.createElement("div"); ort.className = "ort"; ort.textContent = item[0];
      front.appendChild(ort);
      if (item[1]) { const tat = document.createElement("div"); tat.className="tat"; tat.textContent=item[1]; front.appendChild(tat); }
      const rivet = document.createElement("span"); rivet.className="rivet"; front.appendChild(rivet);

      const back = document.createElement("div"); back.className = "face back";
      const stamp = document.createElement("div"); stamp.className = "stamp"; stamp.textContent = "Erledigt";
      back.appendChild(stamp);

      card.appendChild(front); card.appendChild(back);
      block.appendChild(card);
      block.addEventListener("click", ()=> toggleBlock(block, id));
      blocksEl.appendChild(block);
    });
    updateProgress();
  }

  function toggleBlock(block, id){
    if (done.has(id)) { done.delete(id); block.classList.remove("done"); }
    else { done.add(id); block.classList.add("done"); }
    sndBlock();
    sset("routine:done:"+dayKey, JSON.stringify([...done]));
    updateProgress();
    updateWeek();
  }

  function updateProgress(){
    const cnt = Math.min(done.size, TOTAL);
    pcountEl.textContent = cnt;
    ptotalEl.textContent = TOTAL;
    pfillEl.style.width = TOTAL ? (cnt / TOTAL * 100) + "%" : "0%";
  }

  function buildWeek(){
    weekEl.innerHTML = "";
    const title = document.createElement("div"); title.className = "wk-title"; title.textContent = "Woche";
    weekEl.appendChild(title);
    WD.forEach((name,i)=>{
      const row = document.createElement("div"); row.className = "wk-row" + (i===todayIdx ? " today" : "");
      const d = document.createElement("span"); d.className = "wk-day"; d.textContent = name;
      const c = document.createElement("span"); c.className = "wk-cnt"; c.textContent = "0"; c.dataset.i = i;
      row.appendChild(d); row.appendChild(c); weekEl.appendChild(row);
    });
  }
  function medalFor(cnt){
    if (cnt >= TOTAL)  return "gold";
    if (cnt >= SILVER) return "silber";
    if (cnt >= BRONZE) return "bronze";
    return "";
  }
  function updateWeek(){
    weekArr[todayIdx] = Math.min(done.size, TOTAL);
    weekEl.querySelectorAll(".wk-row").forEach((row,i)=>{
      const cnt = weekArr[i] || 0;
      const cntEl = row.querySelector(".wk-cnt"); if (cntEl) cntEl.textContent = cnt;
      row.classList.remove("bronze","silber","gold");
      const m = medalFor(cnt); if (m) row.classList.add(m);
    });
    sset("routine:week:"+weekKey, JSON.stringify(weekArr));
  }

  function ruleId(i){ return "rule-" + i; }
  function toggleRule(row, id){
    if (done.has(id)) { done.delete(id); row.classList.remove("on"); }
    else { done.add(id); row.classList.add("on"); }
    sndBlock();
    sset("routine:done:"+dayKey, JSON.stringify([...done]));
    updateProgress();
    updateWeek();
  }
  function buildRules(){
    rulesEl.innerHTML = "";
    RULES.forEach((txt,i)=>{
      const id = ruleId(i);
      const row = document.createElement("div");
      row.className = "rule" + (done.has(id) ? " on" : "");
      row.setAttribute("role","button"); row.tabIndex = 0;
      const box = document.createElement("span"); box.className = "rbox";
      const t = document.createElement("span"); t.className = "rtxt"; t.textContent = txt;
      row.appendChild(box); row.appendChild(t);
      const toggle = ()=> toggleRule(row, id);
      row.addEventListener("click", toggle);
      row.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); toggle(); }});
      rulesEl.appendChild(row);
    });
  }
  function refreshRules(){
    rulesEl.querySelectorAll(".rule").forEach((row,i)=>{ row.classList.toggle("on", done.has(ruleId(i))); });
  }

  function setPhase(p, withSound){
    if (!PHASES.includes(p)) return;
    phase = p;
    needleEl.style.transform = "rotate(" + ANGLES[p] + "deg)";
    phaseNm.textContent = PHASE_NAMES[p];
    document.querySelectorAll(".phase-label").forEach(g=>{
      g.classList.toggle("active", g.dataset.phase === p);
    });
    if (withSound) sndTick();
    renderBlocks();
  }

  function applyMode(animate){
    machine.classList.toggle("theme-free", isFree);
    machine.classList.toggle("theme-work", !isFree);
    switchEl.classList.toggle("on", isFree);
    switchEl.setAttribute("aria-pressed", String(isFree));
    plaqueEl.textContent = isFree ? "Freier Tag" : "Werktag";
    wakeEl.textContent = isFree ? "07:00 Uhr" : "06:00 Uhr";
    bedEl.textContent  = isFree ? "00:00 Uhr" : "23:00 Uhr";
    if (animate){
      plaqueEl.classList.remove("flip"); void plaqueEl.offsetWidth; plaqueEl.classList.add("flip");
      surgeEl.classList.remove("fire"); void surgeEl.offsetWidth; surgeEl.classList.add("fire");
    }
  }

  function toggleFree(){
    isFree = !isFree;
    applyMode(true);
    sndSwitch();
    isFree ? sndToFree() : sndToWork();
    sset("routine:free:"+dayKey, isFree ? "1" : "0");
  }

  // ---------- events ----------
  switchEl.addEventListener("click", toggleFree);
  switchEl.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); toggleFree(); }});

  document.getElementById("prev").addEventListener("click", ()=>{
    const i = (PHASES.indexOf(phase) + 3) % 4; setPhase(PHASES[i], true);
  });
  document.getElementById("next").addEventListener("click", ()=>{
    const i = (PHASES.indexOf(phase) + 1) % 4; setPhase(PHASES[i], true);
  });

  soundEl.addEventListener("click", ()=>{
    soundOn = !soundOn;
    soundEl.classList.toggle("on", soundOn);
    soundTxt.textContent = soundOn ? "Ton an" : "Ton aus";
    if (soundOn) sndTick();
  });

  // ---------- init ----------
  weekdayEl.textContent = today.toLocaleDateString("de-DE", { weekday:"long" });
  datumEl.textContent   = today.toLocaleDateString("de-DE", { day:"numeric", month:"long", year:"numeric" });

  applyMode(false);
  setPhase(phase, false);
  buildWeek();
  buildRules();

  // fill decorative gears
  const GEAR = '<svg viewBox="0 0 100 100">' +
    '<circle class="rim" cx="50" cy="50" r="38" stroke-width="13" stroke-dasharray="7.5 7.5"/>' +
    '<circle class="rim" cx="50" cy="50" r="30" stroke-width="3"/>' +
    '<line class="spoke" x1="50" y1="24" x2="50" y2="76"/>' +
    '<line class="spoke" x1="24" y1="50" x2="76" y2="50"/>' +
    '<line class="spoke" x1="32" y1="32" x2="68" y2="68"/>' +
    '<line class="spoke" x1="68" y1="32" x2="32" y2="68"/>' +
    '<circle class="hub" cx="50" cy="50" r="12"/></svg>';
  document.querySelectorAll(".gear").forEach(g => { g.innerHTML = GEAR; });

  // scatter distant city lights (cyberpunk)
  const lightsBox = document.getElementById("lights");
  if (lightsBox){
    const cols = ["--light-warm","--light-cold","--neon-cyan","--neon-yellow","--neon-mag","--neon-blue"];
    const spots = [[8,22],[14,58],[22,14],[30,74],[42,20],[52,66],[63,12],[70,80],[78,30],[86,60],[92,18],[46,88],[18,90],[74,50]];
    spots.forEach((p,i)=>{
      const d = document.createElement("i");
      const c = cols[i % cols.length];
      d.style.left = p[0] + "%"; d.style.top = p[1] + "%";
      d.style.background = "var(" + c + ")";
      d.style.boxShadow = "0 0 6px var(" + c + ")";
      d.style.animation = "flick " + (3 + (i % 5)) + "s infinite " + (i * 0.3) + "s";
      lightsBox.appendChild(d);
    });
  }

  // overlay stored day-overrides
  (async function(){
    const fStored = await sget("routine:free:"+dayKey);
    if (fStored === "1" || fStored === "0"){
      const want = fStored === "1";
      if (want !== isFree){ isFree = want; applyMode(false); }
    }
    const dStored = await sget("routine:done:"+dayKey);
    if (dStored){
      try { JSON.parse(dStored).forEach(id=>done.add(id)); renderBlocks(); } catch(e){}
    }
    refreshRules();
    const wStored = await sget("routine:week:"+weekKey);
    if (wStored){ try { const a = JSON.parse(wStored); if (Array.isArray(a)) for (let i=0;i<7;i++) weekArr[i] = +a[i] || 0; } catch(e){} }
    updateWeek();
  })();
})();
</script>
</body>
</html>
